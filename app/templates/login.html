{% extends "base.html" %}
{% block title %}Log in · Game Night{% endblock %}
{% block content %}
<section class="narrow card pad">
  <h1>Welcome to Game Night</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label>Username <input name="username" autocomplete="username" required autofocus maxlength="32"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary">Log in</button>
  </form>
  <p class="small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
